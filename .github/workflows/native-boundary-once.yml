name: Native exploit runner boundary tests (one-shot)
on:
  push:
    branches: [validation/native-exploit-boundary-tests-20261121]
    paths: [.github/workflows/native-boundary-once.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m unittest discover -s benchmarks/tests -v
          bash -n benchmarks/run-native-exploit.sh
